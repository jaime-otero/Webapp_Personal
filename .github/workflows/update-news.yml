name: Actualizar noticias

on:
  schedule:
    # Horas en UTC. Cada hora de 5 a 22 UTC (7:17–0:17 en España en verano, 6:17–23:17 en invierno)
    # y dos veces de madrugada. Minuto 17 para evitar la congestión de las :00.
    - cron: '17 5-22 * * *'
    - cron: '17 1,3 * * *'
  workflow_dispatch:
    inputs:
      ai_provider:
        description: 'IA para los resúmenes (groq / github = probar esa reserva como si las anteriores fallaran)'
        type: choice
        options: [auto, groq, github]
        default: auto
  push:

permissions:
  contents: read
  models: read # GitHub Models, la última IA de reserva (usa el GITHUB_TOKEN, sin clave aparte)

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    # En push, solo la rama por defecto publica (cron y ejecución manual ya van sobre ella).
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Edición anterior guardada entre ejecuciones: conserva los resúmenes IA aunque la web
      # esté protegida con inicio de sesión y no se pueda descargar.
      - name: Recuperar la edición anterior
        uses: actions/cache@v4
        with:
          path: web/data/news.json
          key: news-${{ github.run_id }}
          restore-keys: news-
      # Los resúmenes IA se regeneran cada 2 h (horas UTC pares); en las horas impares solo entran
      # noticias nuevas y se conservan los resúmenes de la edición anterior.
      - name: ¿Toca resumen IA?
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ $(( 10#$(date -u +%H) % 2 )) -eq 1 ]; then
            echo "SKIP_AI=1" >> "$GITHUB_ENV"
          fi
      - name: Descargar feeds y generar resúmenes
        run: npm run ingest
        env:
          GEMINI_API_KEY: ${{ inputs.ai_provider != 'groq' && inputs.ai_provider != 'github' && secrets.GEMINI_API_KEY || '' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ inputs.ai_provider != 'github' && secrets.GROQ_API_KEY || '' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL }}
          PREVIOUS_DATA_URL: ${{ format('{0}/data/news.json', vars.SITE_URL || 'https://mi-diario.mizepp.workers.dev') }}
      - name: Publicar en Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4' # la acción instala 3.x por defecto, que no soporta Workers solo con assets
          command: deploy
