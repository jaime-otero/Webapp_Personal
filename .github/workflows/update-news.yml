name: Actualizar noticias

on:
  # El lanzador principal es el cron del Worker de Cloudflare (src/worker.js), que llama a
  # workflow_dispatch cada 30 min: el cron de GitHub se retrasa horas o no llega a ejecutarse.
  # Este se queda de reserva y no hace nada si la edición tiene menos de 20 min.
  schedule:
    # Horas en UTC. Cada 30 min de 5:17 a 22:47 UTC (7:17–0:47 en España en verano, 6:17–23:47 en
    # invierno) y dos veces de madrugada. Minutos 17 y 47 para evitar la congestión de las :00 y :30.
    # La primera línea es la única con resúmenes IA (cada 2 h): si se cambia, cambiar también
    # AI_CRON más abajo.
    - cron: '17 6-22/2 * * *'
    - cron: '17 5-21/2 * * *'
    - cron: '47 5-22 * * *'
    - cron: '17 1,3 * * *'
  workflow_dispatch:
    inputs:
      ai_provider:
        description: 'IA para los resúmenes (groq / github = probar esa reserva como si las anteriores fallaran)'
        type: choice
        options: [auto, groq, github]
        default: auto
      resumen_ia:
        description: 'Regenerar los resúmenes IA (no = solo noticias nuevas, conserva los resúmenes)'
        type: choice
        options: [si, no]
        default: si
  push:
    branches: [main]

permissions:
  contents: read
  models: read # GitHub Models, la última IA de reserva (usa el GITHUB_TOKEN, sin clave aparte)

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    # En push, solo la rama por defecto publica (cron y ejecución manual ya van sobre ella).
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Edición anterior, guardada entre ejecuciones: de ella salen los resúmenes IA que se conservan
      # cuando la IA falla o no toca, y la hora de la última edición.
      - name: Recuperar la edición anterior
        uses: actions/cache@v6
        with:
          path: web/data/news.json
          key: news-${{ github.run_id }}
          restore-keys: news-
      # El cron de GitHub es solo de reserva: si el Worker ya publicó hace menos de 20 min, no
      # hace nada (así no se duplican ejecuciones ni resúmenes IA).
      - name: ¿Edición reciente?
        if: github.event_name == 'schedule'
        run: |
          if [ -f web/data/news.json ] && node -e "
            const t = Date.parse(JSON.parse(require('fs').readFileSync('web/data/news.json')).generatedAt);
            process.exit(Date.now() - t < 20 * 60e3 ? 0 : 1)"; then
            echo "Edición de hace menos de 20 min: nada que hacer"
            echo "FRESH=1" >> "$GITHUB_ENV"
          fi
      # Los resúmenes IA se regeneran cada 2 h; en las demás ejecuciones solo entran noticias nuevas
      # y se conservan los resúmenes de la edición anterior. El Worker lo indica con resumen_ia; en
      # el cron de GitHub se mira qué cron lanzó la ejecución, no la hora, porque se retrasa.
      - name: ¿Toca resumen IA?
        env:
          AI_CRON: '17 6-22/2 * * *'
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$SCHEDULE" != "$AI_CRON" ]; then
            echo "SKIP_AI=1" >> "$GITHUB_ENV"
          fi
          if [ "${{ inputs.resumen_ia }}" = "no" ]; then
            echo "SKIP_AI=1" >> "$GITHUB_ENV"
          fi
      - name: Descargar feeds y generar resúmenes
        if: env.FRESH != '1'
        run: npm run ingest
        env:
          GEMINI_API_KEY: ${{ inputs.ai_provider != 'groq' && inputs.ai_provider != 'github' && secrets.GEMINI_API_KEY || '' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ inputs.ai_provider != 'github' && secrets.GROQ_API_KEY || '' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL }}
      - name: Publicar en Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != '' && env.FRESH != '1'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4' # la acción instala 3.x por defecto, que no soporta Workers solo con assets
          command: deploy
