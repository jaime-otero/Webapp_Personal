name: Vigilar noticias

# Avisa si la web lleva demasiado sin recibir una edición nueva (Worker caído, token de
# GitHub caducado, ingesta rota…). El aviso es un issue: GitHub lo manda por correo y se cierra
# solo cuando las noticias vuelven a actualizarse.
# Necesita la variable SITE_URL (Settings → Secrets and variables → Actions → Variables), p. ej.
# https://mi-diario.TU-SUBDOMINIO.workers.dev. Sin ella no hace nada.
on:
  schedule:
    - cron: '23 * * * *' # minuto 23: lejos de la congestión de las :00 y :30
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vigilar-noticias
  cancel-in-progress: false

env:
  # El Worker publica cada 30 min de 5:17 a 22:47 UTC: 3 ediciones perdidas = problema.
  MAX_MINUTES: 90
  TITLE: '⚠️ Las noticias no se actualizan'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Comprobar la última edición
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::warning::Falta la variable SITE_URL: no se puede vigilar la web"
            exit 0
          fi
          # De 23:00 a 5:59 UTC el Worker casi no publica: no se comprueba (un manual sí).
          HOUR=$((10#$(date -u +%H)))
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$HOUR" -lt 6 ] || [ "$HOUR" -gt 22 ]; }; then
            echo "Fuera del horario de publicación"
            exit 0
          fi
          STATUS=0
          REPORT=$(node scripts/ci/freshness.js "${SITE_URL%/}/data/meta.json" "$MAX_MINUTES") || STATUS=$?
          echo "$REPORT"
          OPEN=$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ "$STATUS" = 0 ]; then
            if [ -n "$OPEN" ]; then
              gh issue close "$OPEN" --comment "Las noticias vuelven a actualizarse ($REPORT)."
            fi
            exit 0
          fi
          if [ -z "$OPEN" ]; then
            gh issue create --title "$TITLE" --body "$REPORT.

          Qué mirar, por orden:
          1. *Actions → Actualizar noticias*: ¿hay ejecuciones recientes y en verde?
          2. Logs del Worker (Cloudflare → Workers & Pages → mi-diario → Logs): un \`GitHub dispatch 401/403/404\` significa que el secreto \`GITHUB_DISPATCH_TOKEN\` caducó o perdió el permiso *Actions: write*.
          3. Que la web responda en \`$SITE_URL\`.

          Este issue se cierra solo cuando la edición vuelve a ser reciente."
          fi
          echo "::error::$REPORT"
          exit 1
