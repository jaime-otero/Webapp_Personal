name: CI

# Tests en cada pull request: la regla de la rama main exige que pasen antes de fusionar
# (el despliegue de update-news.yml solo corre tras llegar a main).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
